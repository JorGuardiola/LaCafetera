# .github/workflows/deploy.yml
name: Despliegue Automático a InfinityFree

# Se ejecuta al hacer push a la rama principal (main)
on:
  push:
    branches:
      - main  # Asegúrate de que esta sea la rama que usas para producción

jobs:
  web_deploy:
    name: Subir Archivos por FTP
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout del Repositorio
      # Descarga el código de GitHub
      uses: actions/checkout@v4

    - name: 2. Despliegue por FTP
      # Usa la acción para conectar y subir archivos
      uses: SamKirkland/FTP-Deploy-Action@v4.3.0
      with:
        server: ${{ secrets.FTP_HOST }}       
        username: ${{ secrets.FTP_USERNAME }} 
        password: ${{ secrets.FTP_PASSWORD }} 
        protocol: ftp                         # Usa 'ftp' ya que el puerto es 21 (FTP estándar)
        local-dir: ./                         # Sube la raíz de tu repositorio
        server-dir: htdocs/                   # Sube a la carpeta de destino en InfinityFree
        # IMPORTANTE: Esta línea garantiza que se borren del servidor los archivos que ya no están en tu repositorio.
        delete-local: true
        
    - name: 3. Despliegue Finalizado
      run: echo "¡Despliegue exitoso a la carpeta htdocs y archivos viejos eliminados!"
